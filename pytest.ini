[pytest]
# ── Marker registry (every tag from the manual sheet + SKILL.md) ──────────────
markers =
    smoke: Critical path; run on every push
    regression: Full regression suite
    api: API-layer tests only (no browser)
    ui: UI/browser tests
    e2e: Cross-layer end-to-end tests
    negative: Negative / error path scenarios
    boundary: Boundary value tests
    security: Auth / access-control tests
    contract: JSON schema contract assertions
    nfr: Non-functional requirements (performance, headers)

# ── Default options ────────────────────────────────────────────────────────────
addopts =
    --strict-markers
    --tb=short
    -p no:warnings
    --alluredir=reports/allure

# ── pytest-bdd ─────────────────────────────────────────────────────────────────
bdd_features_base_dir = features

# ── Paths ──────────────────────────────────────────────────────────────────────
testpaths = tests

