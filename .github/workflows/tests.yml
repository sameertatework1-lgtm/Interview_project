name: Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test marker to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - api
          - ui
          - e2e
          - regression

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Lint and format check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Smoke Tests (Push / PR)
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://automationintesting.online' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://automationintesting.online/api' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'password' }}
          HEADLESS: 'true'
        run: |
          pytest -m smoke --reruns 1 --reruns-delay 2

      - name: Run Targeted Suite (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://automationintesting.online' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://automationintesting.online/api' }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'password' }}
          HEADLESS: 'true'
        run: |
          pytest -m "${{ inputs.test_type }}" --reruns 1 --reruns-delay 2

      - name: Upload Allure Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure/
          retention-days: 14

      - name: Upload Playwright Failure Artifacts (Screenshots & Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            reports/screenshots/
            reports/traces/
            reports/videos/
          retention-days: 7
